[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-forensic-replay"
version = "0.1.0"
description = "Content-addressed forensic evidence bundles and side-effect-free replay for InnerOS agents."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inneros_forensic_replay" = ["py.typed"]
